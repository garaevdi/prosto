---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: systemd
    system:
      enabled:
        - ublue-lightdm-workaround.service

  - type: dnf
    repos:
      copr:
        - garaevdi/pantheon-rpm
      nonfree: rpmfusion
      cleanup: true
    install:
      packages:
        - appcenter
        - elementary-dock
        - elementary-greeter
        - elementary-settings
        - elementary-shortcut-overlay
        - elementary-sideload
        - elementary-terminal
        - elementary-files
        - elementary-files-portal
        - gala
        - pantheon-agent-polkit
        - pantheon-session-settings
        - plymouth-theme-elementary
        - switchboard
        - wingpanel
        - xdg-desktop-portal-pantheon
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - gstreamer1-plugin-openh264
    remove:
      packages:
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        repo:
          tilte: elementary
          url: https://flatpak.elementary.io/repo.flatpakrepo
        install:
          - io.elementary.calculator
          - io.elementary.calendar
          - io.elementary.camera
          - io.elementary.capnet-assist
          - io.eleemntary.contacts
          - io.eleemntary.iconbrowser
          - io.elementary.mail
          - io.elementary.maps
          - io.elementary.music
          - io.elementary.photos
          - io.elementary.screenshot
          - io.elementary.tasks
          - io.elementary.videos
          - org.gnome.Epiphany
          - org.gnome.Evince
          - org.gnome.FileRoller
          - org.gnome.font-viewer
      - scope: user # Also add Flathub user repo, but no user packages

  - type: initramfs
